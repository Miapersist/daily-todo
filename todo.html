<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办</title>
<style>
:root {
  --bg: #f0f3ff;
  --card: #ffffff;
  --text: #1e1b4b;
  --text2: #6b7280;
  --text3: #9ca3af;
  --border: #e2e5ff;
  --primary: #6366f1;
  --primary-bg: #eef0ff;
  --blue: #6366f1;
  --blue-bg: #eef0ff;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --red: #e11d48;
  --red-bg: #fce7f3;
  --amber: #3b82f6;
  --amber-bg: #dbeafe;
  --coral: #e11d48;
  --coral-bg: #fce7f3;
  --pink: #be185d;
  --pink-bg: #fce7f3;
  --gray-bg: #f3f4f6;
  --radius: 10px;
  --radius-sm: 6px;
}
.dark {
  --bg: #0f0f1a; --card: #1a1a28; --text: #e8e8f0; --text2: #9898b0;
  --text3: #606078; --border: #282840; --gray-bg: #1e1e30;
  --blue-bg: #1a2038; --green-bg: #1a281e; --red-bg: #2a1a20;
  --amber-bg: #1a2038; --coral-bg: #281a1e;
}
.dark body { background: #0d0d18; }
.dark .app { background: linear-gradient(180deg, #1a1a2c 0%, #161628 100%); box-shadow: 0 4px 32px rgba(0,0,0,.4), 0 0 1px rgba(99,102,241,.08); }
.dark .stat { background: linear-gradient(135deg, #1a1a2c, #1e1e32); border-color: #282840; }
.dark .stat:hover { border-color: #6366f1; box-shadow: 0 0 12px rgba(99,102,241,.1); }
.dark .stat.active { background: linear-gradient(to bottom, #1e2038, #222440); border-color: #6366f1; box-shadow: 0 0 24px rgba(99,102,241,.18); }
.dark .stat .num { color: #e0e0e8; }
.dark .task { background: linear-gradient(135deg, #1a1a2c, #1e1e30); border-color: #282840; }
.dark .task:hover { box-shadow: 0 2px 10px rgba(99,102,241,.15); border-color: #3a3a60; }
.dark .btn { border-color: #2a2a44; background: #1e1e32; color: var(--text); }
.dark .btn:hover { background: #282840; }
.dark .view-toggle { border-color: #2a2a44; }
.dark .view-toggle button { color: var(--text2); border-color: #2a2a44; }
.dark .quick-add { background: linear-gradient(135deg, #1a1a2c, #1e1e30); border-color: #2a2a44; }
.dark .quick-add input { background: transparent; }
.dark .quick-add select, .dark .quick-add .qa-plus { background: #1e1e30; border-color: #2a2a44; color: var(--text); }
.dark .search-bar input { background: linear-gradient(135deg, #1a1a2c, #1e1e30); border-color: #2a2a44; }
.dark .modal { background: linear-gradient(180deg, #1e1e30, #1a1a28); border: 1px solid #282840; }
.dark .modal input, .dark .modal select, .dark .modal textarea { background: #141420; border-color: #2a2a44; color: var(--text); }
.dark select, .dark input, .dark textarea { background: #141420; border-color: #2a2a44; color: var(--text); }
.dark .cal-col.today { background: #181830; }
.dark .cal-col.today .cal-col-head { background: #1a1a38; }
.dark .cal-block { color: var(--text); }
.dark .day-fold { color: var(--text3); }
.dark .day-fold:hover { color: var(--text2); }
.dark .toast { background: #2a2a40; }
.dark .toast .undo-btn { color: #818cf8; }
.dark .tag.p-high { background: linear-gradient(135deg, #2a1a20, #301e24); color: #f87171; }
.dark .tag.p-mid { background: linear-gradient(135deg, #1a2038, #1e2640); color: #60a5fa; }
.dark .tag.p-low { background: linear-gradient(135deg, #1e1e30, #242436); color: #9898b0; }
.dark .tag.t-work { background: linear-gradient(135deg, #1a1a38, #1e2040); color: #a5b4fc; }
.dark .tag.t-life { background: linear-gradient(135deg, #1a281e, #1e2a22); color: #86efac; }
.dark .tag.blocking { background: linear-gradient(135deg, #2a1a20, #301e24); color: #f87171; }
.dark .tag.overdue { background: linear-gradient(135deg, #2a1a20, #301e24); color: #f87171; }
.dark .tag.s-todo  { background: linear-gradient(135deg, #1e1e30, #242436); color: #9898b0; }
.dark .tag.s-doing { background: linear-gradient(135deg, #1a2038, #1e2640); color: #60a5fa; }
.dark .tag.s-block { background: linear-gradient(135deg, #2a1a20, #301e24); color: #f87171; }
.dark .tag.s-done  { background: linear-gradient(135deg, #1a281e, #1e2a22); color: #86efac; }
.dark .quick-add { border-style: solid; }
.dark .filter-btn { border-color: #2a2a44; }
.dark .batch-bar span { color: var(--text2); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #eef0f5;
  color: var(--text); line-height: 1.6; min-height: 100vh;
}
.app {
  max-width: none; margin: 0; padding: 24px 32px 48px;
  background: linear-gradient(180deg, #ffffff 0%, #f8f9ff 100%);
  border-radius: 0;
  box-shadow: none;
  min-height: 100vh;
}
@media (max-width: 760px) { .app { margin: 0; border-radius: 0; padding: 20px 16px 32px; box-shadow: none; } }

/* ===== 列表两列：行优先（左→右再换行），标题/折叠行通栏 ===== */
.day-section, .priority-section, .gcbody {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 14px; row-gap: 6px; align-items: start;
}
.day-section > .day-header, .day-section > .day-fold, .day-section > .empty,
.priority-section > .pri-header, .priority-section > .empty,
.gcbody > .day-fold, .gcbody > .empty { grid-column: 1 / -1; }
.day-section > .task, .priority-section > .task, .gcbody > .task { margin-bottom: 0; }
@media (min-width: 1600px) { .day-section, .priority-section, .gcbody { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .day-section, .priority-section, .gcbody { grid-template-columns: minmax(0, 1fr); } }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #6366f1, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.header-actions { display: flex; gap: 6px; align-items: center; }
.theme-btn { padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); font-size: 14px; cursor: pointer; line-height: 1; }
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-sm); font-size: 13px; color: var(--text); cursor: pointer; transition: background .15s; line-height: 1.4; }
.btn:hover { background: linear-gradient(135deg, #f0f3ff, #eef0ff); }
.btn.primary { background: linear-gradient(135deg, #6366f1, #3b82f6); color: #fff; border: none; }
.btn.primary:hover { background: linear-gradient(135deg, #4f46e5, #2563eb); }
.btn.sm { padding: 3px 10px; font-size: 12px; }
.view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; width: fit-content; }
.view-toggle button { padding: 6px 16px; border: none; background: transparent; font-size: 13px; color: var(--text2); cursor: pointer; border-right: 1px solid var(--border); }
.view-toggle button:last-child { border-right: none; }
.view-toggle button.active { background: linear-gradient(135deg, #6366f1, #3b82f6); color: #fff; }
.search-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
.search-bar input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-family: inherit; background: linear-gradient(135deg, #fff, #f8f9ff); color: var(--text); }
.search-bar input::placeholder { color: var(--text3); }
.search-bar input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
.search-bar .search-clear { font-size: 12px; color: var(--text3); cursor: pointer; white-space: nowrap; }
.stats { display: flex; gap: 10px; margin-bottom: 24px; }
.stat { background: linear-gradient(135deg, #f8f9ff, #eef0ff); border: 1px solid #e2e5ff; cursor: pointer; border-radius: 10px; padding: 8px 14px; text-align: center; flex: 1; transition: all .2s ease; }
.stat:hover { border-color: #6366f1; box-shadow: 0 2px 8px rgba(99,102,241,.06); }
.stat.active { border-color: #6366f1; background: linear-gradient(to bottom, #eef0ff, #dbe0ff); box-shadow: 0 0 14px rgba(99,102,241,.12); }
.stat.active .num { color: #6366f1; }
.stat.active .lbl { color: #6366f1; }
.stat .num { font-size: 18px; font-weight: 600; display: block; }
.stat .lbl { font-size: 11px; color: var(--text3); margin-top: 1px; display: block; }
.day-section { margin-bottom: 18px; }
.day-header { font-size: 15px; font-weight: 600; padding-bottom: 6px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.day-header .badge { font-size: 11px; font-weight: 500; padding: 2px 10px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #3b82f6); color: #fff; }
.day-header.roll-label { font-size: 13px; color: var(--red); margin-top: 2px; margin-bottom: 4px; font-weight: 500; }
.task { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; margin-bottom: 4px; background: linear-gradient(135deg, #fff, #f8f9ff); border: 1px solid var(--border); border-radius: 12px; transition: all .15s ease; position: relative; overflow: hidden; }
.task::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.task.pri-high::before { background: linear-gradient(180deg, #e11d48, #f87171); }
.task.pri-mid::before { background: linear-gradient(180deg, #3b82f6, #60a5fa); }
.task.pri-low::before { background: linear-gradient(180deg, #9ca3af, #cbd5e1); }
.task:hover { box-shadow: 0 2px 8px rgba(99,102,241,.08); transform: translateY(-1px); border-color: #c7d2fe; }
.task.done { opacity: 0.6; }
.task.done .task-title { text-decoration: line-through; }
.task.done:hover { opacity: 0.8; }
.task.selected { border-color: var(--blue); background: var(--blue-bg); }
.task input[type="checkbox"] { width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; accent-color: var(--blue); cursor: pointer; }
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 14px; font-weight: 500; margin: 0; line-height: 1.4; word-break: break-word; }
.act-row { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.act-btn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 0; border-radius: 50%; cursor: pointer; font-size: 0; flex-shrink: 0; transition: all .15s ease; background-size: contain; background-position: center; background-repeat: no-repeat; }
.act-btn:hover { transform: scale(1.18); }
.act-postpone { font-size: 17px; line-height: 1; color: #d97706; display: inline-flex; align-items: center; justify-content: center; }
.task-postpone { font-size: 11px; color: var(--text3); margin-top: 3px; }
.task-postpone::before { content: '» '; }
.dark .task-postpone { color: #9898b0; }
.wish .task-postpone { color: #b0a0c0; }

.act-done:hover { opacity: 1; transform: scale(1.18); }
.task-detail { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
.task-meta { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
.task-timeline { font-size: 10px; color: var(--text3); margin-top: 2px; }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; line-height: 1.6; }
.tag.p-high { background: linear-gradient(135deg, #fef2f2, #fde8e8); color: #e11d48; }
.tag.p-mid { background: linear-gradient(135deg, #dbeafe, #eff6ff); color: #3b82f6; }
.tag.p-low { background: linear-gradient(135deg, #f3f4f6, #f9fafb); color: #6b7280; }
.tag.t-work { background: linear-gradient(135deg, #eef0ff, #f0f3ff); color: #6366f1; }
.tag.t-life { background: linear-gradient(135deg, #dcfce7, #f0fdf4); color: #16a34a; }
.tag.blocking { background: linear-gradient(135deg, #fce7f3, #fdf2f8); color: #e11d48; }
.tag.overdue { background: linear-gradient(135deg, #fce7f3, #fef2f2); color: #e11d48; }
.tag.s-todo  { background: linear-gradient(135deg, #f3f4f6, #f9fafb); color: #6b7280; }
.tag.s-doing { background: linear-gradient(135deg, #dbeafe, #eff6ff); color: #3b82f6; }
.tag.s-block { background: linear-gradient(135deg, #fce7f3, #fdf2f8); color: #e11d48; }
.tag.s-done  { background: linear-gradient(135deg, #dcfce7, #f0fdf4); color: #16a34a; }
.prog-chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; background: var(--gray-bg); color: var(--text2); line-height: 1.6; }
.prog-chip.full { background: var(--green-bg); color: var(--green); }
.dark .prog-chip { background: #242436; color: #9898b0; }
.dark .prog-chip.full { background: #1a281e; color: #86efac; }
.prog-input { width: 58px; padding: 1px 4px; font-size: 11px; font-weight: 600; text-align: center; font-family: inherit; border: 1px solid var(--primary); border-radius: 10px; background: var(--card); color: var(--text); }
/* ===== 任务卡就地速改（.ie = inline editable） ===== */
.ie { outline: none; cursor: text; }
.ie-title { border-bottom: 1px dashed transparent; border-radius: 3px; padding: 0 2px; margin: 0 -2px; }
.ie-title:hover { border-bottom-color: var(--border); background: var(--gray-bg); }
.ie-title:focus { border-bottom-color: var(--primary); background: var(--primary-bg); }
.task-detail.ie { padding: 2px 5px; margin: 3px -5px 0; border-radius: 5px; min-height: 20px; }
.task-detail.ie:hover { background: var(--gray-bg); }
.task-detail.ie:focus { background: var(--primary-bg); }
.task-detail.ie[data-empty]:empty::before { content: '点击添加备注…'; color: var(--text3); }
.day-tag.ie, .tt-group.ie, .tag.ie, .prog-chip.ie { cursor: pointer; }
.day-tag.ie:hover, .tt-group.ie:hover { background: var(--primary-bg); color: var(--primary); border-radius: 5px; }
.tag.ie:hover, .prog-chip.ie:hover { filter: brightness(.95); background: var(--primary-bg); color: var(--primary); }
.tt-none { color: var(--text3); font-weight: 400; }
.dark .task-detail.ie:hover, .dark .ie-title:hover { background: #242436; }
.dark .task-detail.ie:focus, .dark .ie-title:focus { background: #1a2038; }
/* ===== 日报视图 ===== */
.rpt-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.rpt-hint { font-size: 12px; color: var(--text3); }
.rpt-bar .spacer { flex: 1; min-width: 8px; }
.rpt-text { width: 100%; min-height: 52vh; padding: 14px; border: 1.5px dashed var(--border); border-radius: 12px; background: linear-gradient(135deg, #fff, #f8f9ff); color: var(--text); font-family: inherit; font-size: 13px; line-height: 1.9; white-space: pre-wrap; word-break: break-word; outline: none; transition: border-color .15s, box-shadow .15s; }
.rpt-text:hover { border-color: #c7d2fe; }
.rpt-text:focus { border-color: var(--primary); border-style: solid; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
.rpt-text:empty::before { content: '暂无'; color: var(--text3); }
.dark .rpt-text { background: linear-gradient(135deg, #1a1a2c, #1e1e30); border-color: #2a2a44; }
.rpt-topic { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.rpt-topic .rt-label { font-size: 13px; font-weight: 600; color: var(--text2); white-space: nowrap; }
.rpt-topic input { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; background: var(--card); color: var(--text); }
.rpt-topic input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
.vt-badge { display: inline-block; font-size: 10px; font-weight: 600; margin-left: 4px; padding: 0 5px; border-radius: 8px; background: var(--primary-bg); color: var(--primary); vertical-align: 1px; }
.sync-badge { font-size: 11px; padding: 3px 9px; border-radius: 10px; white-space: nowrap; }
.sync-wait { background: var(--amber-bg); color: var(--blue); }
.sync-ok { background: var(--green-bg); color: var(--green); }
.sync-err { background: var(--red-bg); color: var(--red); }
.rpt-tog { font-size: 10px; padding: 1px 7px; border: 1px solid var(--primary); border-radius: 8px; background: var(--primary-bg); color: var(--primary); cursor: pointer; line-height: 1.7; margin-left: 4px; flex-shrink: 0; font-family: inherit; }
.rpt-tog.off { border-color: var(--border); background: var(--gray-bg); color: var(--text3); }
.rpt-tog:hover { filter: brightness(.95); }
.rpt-tog.life { border-color: var(--green); background: var(--green-bg); color: var(--green); }
/* 分组拖动排序 */
.gdrag { cursor: grab; font-size: 13px; color: var(--text3); padding: 0 2px; line-height: 1; flex-shrink: 0; user-select: none; }
.gdrag:hover { color: var(--primary); }
.gdrag:active { cursor: grabbing; }
.gcard.dragging { opacity: .45; }
.gcard.drop-before { box-shadow: inset 0 3px 0 var(--primary); }
.gcard.drop-after { box-shadow: inset 0 -3px 0 var(--primary); }
.dark .rpt-tog { background: #1a2038; border-color: #3a3a60; color: #a5b4fc; }
.dark .rpt-tog.off { background: #242436; border-color: #2a2a44; color: #606078; }
.dark .rpt-tog.life { background: #1a281e; border-color: #2a4a34; color: #86efac; }
/* 日报页顶部：参与日报的分组开关 */
.rpt-groups { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; }
.rpt-groups .rg-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-right: 2px; }
.rpt-groups .rg-tip { font-size: 11px; color: var(--text3); }
.g-chip { font-family: inherit; font-size: 11px; padding: 3px 10px; border-radius: 10px; border: 1px solid var(--primary); background: var(--primary-bg); color: var(--primary); cursor: pointer; line-height: 1.7; transition: filter .12s, transform .12s; }
.g-chip:hover { filter: brightness(.95); transform: translateY(-1px); }
.g-chip.life { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.g-chip.off { border-color: var(--border); background: var(--gray-bg); color: var(--text3); text-decoration: line-through; }
.dark .g-chip { background: #1a2038; border-color: #3a3a60; color: #a5b4fc; }
.dark .g-chip.life { background: #1a281e; border-color: #2a4a34; color: #86efac; }
.dark .g-chip.off { background: #242436; border-color: #2a2a44; color: #606078; }
.view-toggle button.active .vt-badge { background: rgba(255,255,255,.25); color: #fff; }
.gmenu.floating { position: fixed; z-index: 1200; max-height: 280px; }
.gmenu .gm-day { float: right; font-size: 11px; color: var(--text3); margin-left: 8px; }
.gmenu .gm-custom { padding: 6px 6px 4px; border-top: 1px solid var(--border); margin-top: 4px; }
.gmenu .gm-custom input { width: 100%; padding: 4px 6px; font-size: 12px; font-family: inherit; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); }
.dark .gmenu.floating { background: #1e1e30; border-color: #2a2a44; }
.status-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: -8px; margin-bottom: 14px; }
.sb-label { font-size: 12px; color: var(--text3); margin-right: 2px; }
.sb-num { font-style: normal; font-size: 11px; opacity: .7; margin-left: 3px; }
.gcard { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; background: linear-gradient(135deg, #fff, #f8f9ff); overflow: hidden; }
.gchead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; user-select: none; border-bottom: 0.5px solid var(--border); }
.gcard.collapsed .gchead { border-bottom: none; }
.gchead .caret { font-size: 11px; color: var(--text3); transition: transform .15s; flex-shrink: 0; }
.gchead .caret.closed { transform: rotate(-90deg); }
.gcname { font-size: 14px; font-weight: 600; outline: none; border-bottom: 1px dashed transparent; }
.gcname:focus { border-bottom-color: var(--primary); }
.gcpri { font-size: 11px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text2); }
.gcmeta { font-size: 12px; color: var(--text3); flex-shrink: 0; }
.gcbar { flex: 1; min-width: 40px; height: 6px; background: var(--gray-bg); border-radius: 3px; overflow: hidden; }
.gcbar i { display: block; height: 100%; background: linear-gradient(135deg, #6366f1, #3b82f6); }
.gcpct { font-size: 12px; font-weight: 600; width: 34px; text-align: right; flex-shrink: 0; }
.gcnote { font-size: 12px; color: var(--text2); padding: 0 14px 8px; outline: none; }
.gcbody { padding: 10px 12px 12px; }
.dark .gcard { background: linear-gradient(135deg, #1a1a2c, #1e1e30); border-color: #282840; }
.wish .gcard { background: rgba(255,255,255,.7); border-color: rgba(220,200,240,.35); border-radius: 14px; }
.wish .gcbar i { background: linear-gradient(135deg, #f472b6, #fb7185); }
.rpt-sum { display: flex; gap: 10px; margin-bottom: 14px; }
.rs-col { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: linear-gradient(135deg, #f8f9ff, #eef0ff); text-align: center; }
.rs-h { font-size: 12px; color: var(--text2); }
.rs-n { font-size: 26px; font-weight: 700; line-height: 1.2; background: linear-gradient(135deg, #6366f1, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.rs-l { font-size: 11px; color: var(--text3); margin-top: -2px; }
.rs-sub { font-size: 11px; color: var(--text3); margin-top: 6px; }
.dark .rs-col { background: linear-gradient(135deg, #1a1a2c, #1e1e32); border-color: #282840; }
.wish .rs-col { background: linear-gradient(135deg, #fef5fc, #fdf0ff); border-color: rgba(220,200,240,.5); }
.wish .rs-n { background: linear-gradient(135deg, #f472b6, #fb7185); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.tt-group { color: var(--primary); font-weight: 600; margin-right: 2px; }
.wish .tt-group { color: #ec4899; }
.dark .tt-group { color: #a5b4fc; }
.qa-wrap { flex: 1 1 auto; position: relative; min-width: 0; display: flex; }
.qa-wrap > input { flex: 1 1 auto; width: 100%; min-width: 0; }
.gmenu { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 60; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(99,102,241,.12); max-height: 220px; overflow-y: auto; padding: 4px; }
.gmenu.hide { display: none; }
.gmenu .gm-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--text); }
.gmenu .gm-item.on { background: var(--primary-bg); color: var(--primary); }
.gmenu .gm-new { color: var(--primary); font-weight: 500; }
.gmenu .gm-empty { padding: 6px 8px; font-size: 12px; color: var(--text3); }
.qa-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 10px; background: var(--primary-bg); color: var(--primary); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.qa-chip:hover { filter: brightness(.96); }
.qa-chip.hide { display: none; }
.wish .qa-chip { background: rgba(244,114,182,.12); color: #ec4899; }
.dark .qa-chip { background: #1a2038; color: #a5b4fc; }
.status-line { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.sl-item { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); cursor: pointer; }
.sl-item:hover { color: var(--text); }
.sl-item.s-on { color: var(--text); font-weight: 500; }
.sl-item b { font-weight: 600; color: var(--text); }
.s-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.s-dot.s-todo { background: #9ca3af; }
.s-dot.s-doing { background: #3b82f6; }
.s-dot.s-block { background: #e11d48; }
.day-tag { font-size: 11px; color: var(--text3); margin-left: 4px; }
.task-actions { display: flex; gap: 4px; flex-shrink: 0; opacity: 0; transition: opacity .12s; }
.task:hover .task-actions { opacity: 1; }
.task-actions button { background: none; border: none; cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px; color: var(--text3); }
.task-actions button:hover { background: var(--gray-bg); color: var(--text); }
.task-actions button.del:hover { background: var(--red-bg); color: var(--red); }
.priority-section { margin-bottom: 18px; }
.pri-header { font-size: 15px; font-weight: 600; padding-bottom: 6px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.empty { text-align: center; padding: 48px 0; color: var(--text3); font-size: 14px; line-height: 2; }
.empty .icon { font-size: 36px; display: block; margin-bottom: 8px; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; z-index: 1000; padding: 16px 20px; animation: fadeIn .15s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal { background: linear-gradient(135deg, #fff, #f8f9ff); border-radius: var(--radius); padding: 24px; width: 90%; max-width: 500px; box-shadow: 0 8px 32px rgba(0,0,0,.12); max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; animation: slideUp .2s ease; }
@keyframes slideUp { from{transform:translateY(20px);opacity:.8} to{transform:translateY(0);opacity:1} }
.modal-body { flex: 1; overflow-y: auto; min-height: 0; }
.modal-footer { padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
.modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.modal label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--text2); }
.modal input, .modal select, .modal textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; margin-bottom: 12px; background: var(--bg); color: var(--text); }
.modal textarea { resize: vertical; min-height: 50px; font-family: monospace; font-size: 12px; }
.modal .row { display: flex; gap: 12px; }
.modal .row > * { flex: 1; }
.modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.prio-group { display: flex; gap: 6px; margin-bottom: 12px; }
.prio-group label { flex: 1; text-align: center; padding: 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; background: var(--card); transition: all .12s; }
.prio-group input { display: none; }
.prio-group input:checked + label.high { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.prio-group input:checked + label.mid { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
.prio-group input:checked + label.low { background: var(--gray-bg); border-color: var(--text2); color: var(--text2); }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.kbd { font-size: 11px; color: var(--text3); background: var(--gray-bg); padding: 1px 5px; border-radius: 3px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; border: 0.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 20px; }
.cal-col { border-right: 0.5px solid var(--border); min-height: 120px; }
.cal-col:last-child { border-right: none; }
.cal-col.today { background: #f8faff; }
.dark .cal-col.today { background: #181830; }
.cal-col-head { text-align: center; padding: 8px 2px; border-bottom: 0.5px solid var(--border); font-size: 11px; color: var(--text2); }
.cal-col-head .dow { font-weight: 500; }
.cal-col-head .date { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 1px; }
.cal-col.today .cal-col-head { background: var(--blue-bg); }
.cal-col.today .cal-col-head .date { color: var(--blue); }
.cal-body { padding: 4px 3px; }
.cal-block { font-size: 11px; padding: 3px 5px; margin-bottom: 2px; border-radius: 3px; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border-left: 3px solid transparent; line-height: 1.3; }
.cal-block:hover { filter: brightness(0.95); }
.cal-block.p-high { border-left-color: var(--red); background: var(--red-bg); color: var(--red); }
.cal-block.p-mid { border-left-color: var(--amber); background: var(--amber-bg); color: var(--amber); }
.cal-block.p-low { border-left-color: var(--text3); background: var(--gray-bg); color: var(--text2); }
.cal-block.done { opacity: 0.5; text-decoration: line-through; }
.cal-block.span-start { border-radius: 3px 0 0 3px; margin-right: -3px; padding-right: 2px; }
.cal-block.span-mid { border-radius: 0; margin-left: -3px; margin-right: -3px; padding-left: 2px; padding-right: 2px; }
.cal-block.span-end { border-radius: 0 3px 3px 0; margin-left: -3px; padding-left: 2px; }
.week-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.week-nav button { padding: 3px 10px; border: 2px solid var(--border); border-radius: 1px; background: var(--card); color: var(--text); cursor: pointer; font-size: 16px; line-height: 1; }
.week-nav button:hover { border-color: var(--blue); }
.week-nav .wn-label { font-size: 13px; font-weight: 500; }
.quick-add { display: flex; gap: 6px; margin-bottom: 16px; align-items: center; background: linear-gradient(135deg, #fff, #f8f9ff); border: 1.5px dashed var(--border); border-radius: 12px; padding: 8px 10px; }
.quick-add { gap: 8px; }
.quick-add input { flex: 1; min-width: 0; padding: 8px 12px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: transparent; color: var(--text); }
.quick-add input[type="date"] { flex: none; width: 152px; }
.quick-add select { flex: none; }
.quick-add .qa-plus { flex: none; }
.quick-add input::placeholder { color: var(--text3); }
.quick-add input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
.quick-add select { padding: 7px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; background: var(--card); color: var(--text); }
.quick-add .qa-plus { padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 16px; background: var(--card); color: var(--text2); cursor: pointer; line-height: 1; }
.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; }
.toast { display: flex; align-items: center; gap: 12px; background: #1a1a2e; color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 13px; }
.toast .undo-btn { color: #85B7EB; cursor: pointer; font-weight: 500; white-space: nowrap; }
.day-fold { font-size: 12px; color: var(--text3); cursor: pointer; padding: 3px 0; user-select: none; margin-top: 2px; }
.day-fold:hover { color: var(--text); }
.batch-bar { display: flex; gap: 8px; align-items: center; padding: 8px 0; margin-bottom: 12px; }
.batch-bar span { font-size: 13px; color: var(--text2); }

/* ===== 许愿池模式 ===== */

.wish .stat.active { background: linear-gradient(135deg, #fde8ff, #fce0f5); border-color: rgba(244,114,182,.6); box-shadow: 0 0 20px rgba(244,114,182,.12); }

.wish .stat.active .lbl { color: #f472b6; }
.wish .stat .num { color: #3d2c4a; }
.wish .stat .lbl { color: #8a7a9a; }
.wish .search-bar input { background: rgba(255,255,255,.7); border-color: rgba(220,200,240,.4); color: #3d2c4a; border-radius: 12px; }
.wish .search-bar input::placeholder { color: #b0a0c0; }
.wish .search-bar input:focus { border-color: rgba(244,114,182,.5); box-shadow: 0 0 0 3px rgba(244,114,182,.08); }
.wish .task { background: rgba(255,255,255,.7); border: 1px solid rgba(220,200,240,.35); border-left-width: 1px; border-radius: 14px; }
.wish .task::before { display: none; }
.wish .task.pri-high { box-shadow: inset 0 0 0 1px rgba(244,114,182,.15),0 2px 8px rgba(244,114,182,.06); }
.wish .task.pri-mid { box-shadow: inset 0 0 0 1px rgba(168,139,208,.12); }
.wish .task.pri-low { box-shadow: none; }
.wish .task:hover { background: rgba(255,255,255,.9); border-color: rgba(220,200,240,.6); box-shadow: 0 2px 12px rgba(200,180,220,.15); }
.wish .task.done { opacity: .55; background: linear-gradient(135deg, rgba(244,114,182,.04), rgba(251,113,133,.03)); }
.wish .task-title { color: #3d2c4a; }
.wish .task-detail { color: #8a7a9a; }
.wish .task input[type=checkbox] { accent-color: #f472b6; }

/* ===== v2 容器：{version, updatedAt, groups, tasks}=====
   兼容旧结构（裸数组 / 旧 localStorage 键）：读进来统一归一成容器再使用。 */
function normTask(t) {
  t.status=statusOf(t);
  if(t.postponedCount===undefined){ t.postponedCount=0; t.postponedFrom=null; t.postponeLog=[]; }
  if(typeof t.progress!=='number') t.progress = t.completed?100:0;
  if(t.completed) t.progress = 100;
  return t;
}
function progressOf(t) { return t.completed?100:(typeof t.progress==='number'?t.progress:0); }
function unwrap(d) {
  if(Array.isArray(d)) return {groups:null, tasks:d, notes:null};
  if(d&&Array.isArray(d.tasks)) return {groups:Array.isArray(d.groups)&&d.groups.length?d.groups:null, tasks:d.tasks, notes:(d.dailyNotes&&typeof d.dailyNotes==='object')?d.dailyNotes:null};
  return null;
}
function container() { return {version:2, updatedAt:new Date().toISOString().slice(0,10), groups:groups, tasks:tasks, dailyNotes:dailyNotes}; }

function loadTasks(callback) {
  dailyNotes={}; hasLocalData=false;
  try{ var r=localStorage.getItem(DATA_KEY); if(r){ var d=unwrap(JSON.parse(r)); if(d){ tasks=d.tasks.map(normTask); groups=d.groups||DEFAULT_GROUPS.slice(); dailyNotes=d.notes||{}; hasLocalData=true; callback(); return; } } }catch(e){}
  try{ var old=localStorage.getItem(STORAGE_KEY); if(old){ var od=unwrap(JSON.parse(old)); if(od){ groups=DEFAULT_GROUPS.slice(); tasks=od.tasks.map(normTask); dailyNotes=od.notes||{}; hasLocalData=true; callback(); return; } } }catch(e){}
  try{ var bk=localStorage.getItem(BACKUP_KEY); if(bk){ var bd=unwrap(JSON.parse(bk)); if(bd){ groups=bd.groups||DEFAULT_GROUPS.slice(); tasks=bd.tasks.map(normTask); dailyNotes=bd.notes||{}; hasLocalData=true; callback(); return; } } }catch(e){}
  groups=DEFAULT_GROUPS.slice(); tasks=[]; callback();
}

/* 本机已有数据时不再自动用云端覆盖本地，避免刚改完刷新被回退；
   只有第一次打开（本机没有数据）才自动取云端；想手动同步用「数据 → 从云端拉取最新」。 */
function loadTasksSync() {
  if(hasLocalData){
    /* 本机明明比云端少一大截（多半是误删/误归档），以云端为准自动修复 */
    cloudFetchData(function(d){
      var u=d?unwrap(d):null;
      if(!u||!u.tasks.length) return;
      if(u.tasks.length - tasks.length >= 20){ adopt(u.tasks,u.groups,u.notes); setSyncState('ok'); }
    });
    return;
  }
  setSyncState('pulling');
  cloudFetchData(function(d){
    var u=d?unwrap(d):null;
    if(!u||!u.tasks.length){
      setSyncState('needpull');
      setTimeout(function(){ alert('这台设备上还没有数据，也没能连上云端。\n数据在云端没有丢，网络恢复后点「数据 → 从云端拉取最新」即可取回。'); }, 300);
      return;
    }
    adopt(u.tasks,u.groups,u.notes);
    setSyncState('ok');
  });
}
function adopt(rt,rg,rn){ tasks=rt.map(normTask); if(rg&&rg.length)groups=rg; if(rn)dailyNotes=rn; hasLocalData=true; reportText=''; saveTasksCache(); render(); }

/* 一次性迁移：本机旧分组数据没有「日报归属」字段，这里自动把「备考」类分组归入生活简报。
   只跑一次；之后用户手动改成「自动」不会被改回去。 */
var MIGR_KEY='todo_migr_v3';
function migrateGroups(){
  try{ if(localStorage.getItem(MIGR_KEY)) return; }catch(e){ return; }
  var changed=false;
  groups.forEach(function(g){
    if(String(g.name||'').indexOf('备考')!==0) return;
    if(g.noReport||g.asLife) return;   /* 已有显式设置，尊重用户 */
    g.asLife=true; changed=true;
  });
  try{ localStorage.setItem(MIGR_KEY,'1'); }catch(e){}
  if(changed) saveTasksCache();
}

function saveTasks() { saveTasksCache(); queueCloudSave(); }
function saveTasksCache() {
  tasks.forEach(normTask);
  var c=container(), j=JSON.stringify(c);
  try{ localStorage.setItem(DATA_KEY,j); localStorage.setItem(BACKUP_KEY,j); localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks)); }catch(e){}
}

/* ===== 云端保存：一次只发一个请求、丢了自动补发，改完立刻生效 ===== */
var syncState='idle', syncBusy=false, syncDirty=false, syncFails=0, syncOkTimer=null, shrinkOk=false;
function queueCloudSave(){ if(!GH_TOKEN)return; syncDirty=true; if(!syncBusy) syncStep(); }
function syncStep(){
  if(!syncDirty){ syncBusy=false; return; }
  syncBusy=true; syncDirty=false;
  setSyncState('saving');
  cloudPut(function(ok){
    if(ok){
      syncFails=0; setSyncState('ok'); setTimeout(syncStep, 50);
    }else{
      syncDirty=true; syncFails++; setSyncState('error');
      setTimeout(syncStep, Math.min(10000, 800*syncFails));
    }
  });
}
function b64utf8(s){ return btoa(unescape(encodeURIComponent(s))); }
function unb64utf8(s){ return decodeURIComponent(escape(atob(s.replace(/\s+/g,'')))); }
function cloudPut(cb){
  fetch(GH_API,{method:'GET',headers:{Authorization:'token '+GH_TOKEN}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){
      if(!d||!d.sha){ cb(false); return null; }
      /* 防误删：本机明显比云端少很多时先拦一下，避免一次误操作把云端数据覆盖没 */
      var remoteN=0;
      try{ var rj=JSON.parse(unb64utf8(d.content)); remoteN=(rj&&rj.tasks?rj.tasks.length:0); }catch(e){}
      if(!shrinkOk&&remoteN-tasks.length>=20){
        var go=confirm('云端现有 '+remoteN+' 条任务，本机只有 '+tasks.length+' 条。\n继续上传会让云端少 '+(remoteN-tasks.length)+' 条。\n\n【取消】= 不上传（推荐先点「数据 → 从云端拉取最新」）\n【确定】= 用本机数据覆盖云端');
        if(!go){ shrinkOk=true; cb(true); return null; }
        shrinkOk=true;
      }
      return fetch(GH_API,{method:'PUT',headers:{Authorization:'token '+GH_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({message:'update data v2',content:b64utf8(JSON.stringify(container(),null,2)),sha:d.sha,branch:'main'})})
        .then(function(r){ cb(r.ok); });
    })
    .catch(function(){ cb(false); });
}
function cloudFetchData(cb){
  fetch(GH_API,{headers:{Authorization:'token '+GH_TOKEN}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(!j||!j.content){ cb(null); return; }
      try{ cb(JSON.parse(unb64utf8(j.content))); }catch(e){ cb(null); }
    })
    .catch(function(){ cb(null); });
}
function syncBadgeHtml(){
  if(syncState==='pulling') return '<span class="sync-badge sync-wait">正在取云端数据…</span>';
  if(syncState==='saving')  return '<span class="sync-badge sync-wait">同步中…</span>';
  if(syncState==='error')   return '<span class="sync-badge sync-err">未同步 · 自动重试中</span>';
  if(syncState==='needpull')return '<span class="sync-badge sync-err">未取到云端数据</span>';
  if(syncState==='ok')      return '<span class="sync-badge sync-ok">已同步</span>';
  return '';
}
function setSyncState(s){
  syncState=s;
  clearTimeout(syncOkTimer);
  var el=document.getElementById('sync_badge_slot');
  if(el) el.innerHTML=syncBadgeHtml();
  if(s==='ok') syncOkTimer=setTimeout(function(){ syncState='idle'; var e2=document.getElementById('sync_badge_slot'); if(e2)e2.innerHTML=''; },2000);
}
window.addEventListener('beforeunload', function(e){
  if(syncBusy||syncDirty){ e.preventDefault(); e.returnValue=''; return ''; }
});

/* 分组改存容器后不再单独落库，保留同名函数做兼容 */
function saveGroups() { saveTasksCache(); queueCloudSave(); }
function groupById(gid){ for(var i=0;i<groups.length;i++){ if(groups[i].id===gid) return groups[i]; } return null; }
/* 分组拖动排序：0=还有未完成的区间，1=空或全部已完成的区间（同区间内才能互换位置） */
function groupPendingCount(gid){ var n=0; tasks.forEach(function(t){ if(t.groupId===gid&&!t.completed)n++; }); return n; }
function groupBucketOf(gid){ return groupPendingCount(gid)>0?0:1; }
function clearDropMarks(){ var a=document.querySelectorAll('.gcard.drop-before,.gcard.drop-after'); for(var i=0;i<a.length;i++){ a[i].classList.remove('drop-before'); a[i].classList.remove('drop-after'); } }
function nextGroupId(){ var m=0; groups.forEach(function(g){ var n=parseInt(String(g.id).replace(/\D/g,''),10); if(!isNaN(n)&&n>m)m=n; }); return 'g'+pad(m+1); }
function taskById(id){ var n=parseInt(id,10); for(var i=0;i<tasks.length;i++){ if(tasks[i].id===n) return tasks[i]; } return null; }

/* 本机归档区：归档不删数据，先存这里，可随时取回 */
var ARCHIVE_KEY='todo_archive_v1';
function archiveLoad(){ try{ var r=localStorage.getItem(ARCHIVE_KEY); var a=r?JSON.parse(r):[]; return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function archiveCount(){ return archiveLoad().length; }
function archiveStore(list){
  var all=archiveLoad(), have={};
  all.forEach(function(t){ have[t.id]=1; });
  list.forEach(function(t){ if(!have[t.id]) all.push(t); });
  try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(all)); }catch(e){}
}
function archiveClear(){ try{ localStorage.removeItem(ARCHIVE_KEY); }catch(e){} }

function nextId() { return tasks.length>0?Math.max.apply(null,tasks.map(function(t){return t.id;}))+1:1; }
function tag(c,tx) { return '<span class="tag '+c+'">'+tx+'</span>'; }

function applySort(list) {
  var cp=list.slice();
  var pv={高:3,中:2,低:1};
  var prioSort=function(a,b){ return (pv[b.priority]||2)-(pv[a.priority]||2); };
  if(sortBy==='priority-desc') cp.sort(prioSort);
  else if(sortBy==='priority-asc') cp.sort(function(a,b){ return (pv[a.priority]||2)-(pv[b.priority]||2); });
  else if(sortBy==='createdAt-desc') cp.sort(function(a,b){ var va=a.createdAt?dayValue(a.createdAt):0,vb=b.createdAt?dayValue(b.createdAt):0; return vb-va||prioSort(a,b); });
  else if(sortBy==='createdAt-asc') cp.sort(function(a,b){ var va=a.createdAt?dayValue(a.createdAt):0,vb=b.createdAt?dayValue(b.createdAt):0; return va-vb||prioSort(a,b); });
  else if(sortBy==='completedAt-desc') cp.sort(function(a,b){ var va=a.completedAt?dayValue(a.completedAt):0,vb=b.completedAt?dayValue(b.completedAt):0; return vb-va||prioSort(a,b); });
  else if(sortBy==='completedAt-asc') cp.sort(function(a,b){ var va=a.completedAt?dayValue(a.completedAt):0,vb=b.completedAt?dayValue(b.completedAt):0; return va-vb||prioSort(a,b); });
  else cp.sort(prioSort);
  return cp;
}

function matchesSearch(t) {
  if(!searchQuery) return true;
  var q=searchQuery.toLowerCase();
  if(t.title.toLowerCase().indexOf(q)>=0) return true;
  if(t.detail&&t.detail.toLowerCase().indexOf(q)>=0) return true;
  if(t.blocking&&t.blocking.toLowerCase().indexOf(q)>=0) return true;
  return false;
}

/* ===== 任务状态：从现有字段派生，不落库、零迁移 ===== */
var STATUS_META = [
  {k:'todo', n:'待开始', cls:'s-todo'},
  {k:'doing',n:'进行中', cls:'s-doing'},
  {k:'block',n:'阻塞',   cls:'s-block'},
  {k:'done', n:'已完成', cls:'s-done'}
];
function statusOf(t) {
  if(t.completed) return 'done';
  if(t.blocking)  return 'block';
  if(t.startedAt) return 'doing';
  return 'todo';
}
function statusCounts() {
  var c={todo:0,doing:0,block:0,done:0};
  tasks.forEach(function(t){ c[statusOf(t)]++; });
  return c;
}
function isOverdue(t) { return !t.completed && !!t.day && dayValue(t.day) < dayValue(todayStr()); }
function overdueCount() { var n=0; tasks.forEach(function(t){ if(isOverdue(t))n++; }); return n; }

function filterMatch(t) {
  if(!matchesSearch(t)) return false;
  if(prioFilter!=='all'&&t.priority!==prioFilter) return false;
  if(typeFilter!=='all'&&t.type!==typeFilter) return false;
  if(statusFilter!=='all'&&statusOf(t)!==statusFilter) return false;
  if(postponeFilter&&((t.postponedCount||0)<3||t.completed)) return false;
  if(overdueFilter&&!isOverdue(t)) return false;
  if(filter==='pending') return !t.completed;
  if(filter==='completed') return t.completed;
  return true;
}

function renderTimeline(t) {
  var parts=[];
  if(t.createdAt) parts.push('创建 '+t.createdAt);
  if(t.startedAt) parts.push('开始 '+t.startedAt);
  if(t.postponeLog&&t.postponeLog.length){ var lg=t.postponeLog[t.postponeLog.length-1]; parts.push('延后 '+lg.from+'→'+lg.to); }
  if(t.completed&&t.completedAt) parts.push('完成 '+t.completedAt);
  if(t.completedNote) parts.push('小结: '+t.completedNote);
  return parts.length>0?'<div class="task-timeline">'+parts.join(' &middot; ')+'</div>':'';
}

function groupCard(g, items, isNone) {
  var total=items.length;
  var doneN=items.filter(function(t){return t.completed;}).length;
  var pct=total?Math.round(doneN/total*100):0;
  var pending=applySort(items.filter(function(t){return !t.completed;}));
  var doneItems=items.filter(function(t){return t.completed;});
  var head='<div class="gchead" data-act="g-toggle" data-g="'+g.id+'" title="点击展开 / 收起">'+
    (isNone?'':'<span class="gdrag" draggable="true" data-g="'+g.id+'" title="按住拖动，调整分组顺序（只在「有未完成」或「空/全完成」各自区间内移动）">⠿</span>')+
    '<span class="caret'+(g.collapsed?' closed':'')+'">▼</span>'+
    '<span class="gcname" contenteditable="'+(isNone?'false':'true')+'">'+escapeHtml(g.name)+'</span>'+
    (isNone?'':'<select class="gcpri">'+['高','中','低','none'].map(function(p){return '<option value="'+p+'"'+(g.pri===p?' selected':'')+'>'+(p==='none'?'无':p)+'</option>';}).join('')+'</select>')+
    '<span class="gcmeta">'+doneN+' / '+total+'</span>'+
    '<div class="gcbar"><i style="width:'+pct+'%"></i></div>'+
    '<span class="gcpct">'+pct+'%</span>'+
    (isNone?'':'<button class="rpt-tog'+(groupReportMode(g)==='none'?' off':(groupReportMode(g)==='life'?' life':''))+'" onclick="W.cycleGroupReport(\''+g.id+'\')" title="点击切换：自动 → 生活 → 不参与">日报·'+reportModeText(groupReportMode(g))+'</button>')+
    (isNone?'':'<button class="icon-btn" data-act="g-del" data-g="'+g.id+'" title="删除分组（组内任务转为未分类）">✕</button>')+
    '</div>';
  var note=(isNone||!g.note)?'':'<div class="gcnote" contenteditable="true">'+escapeHtml(g.note)+'</div>';
  var body=g.collapsed?'':('<div class="gcbody">'+
    (pending.length?pending.map(function(t){return renderTask(t,true);}).join(''):'')+
    (!pending.length&&!doneItems.length?'<div class="empty" style="padding:14px 0;">该分组暂无任务</div>':'')+
    (doneItems.length?'<div class="day-fold" onclick="W.toggleCompleted()">'+(W.showCompleted?'收起':'展开')+'已完成 ('+doneItems.length+')</div>':'')+
    ((doneItems.length&&W.showCompleted)?doneItems.map(function(t){return renderTask(t,true);}).join(''):'')+
    '</div>');
  return '<div class="gcard'+(g.collapsed?' collapsed':'')+'" data-g="'+g.id+'">'+head+note+body+'</div>';
}

function renderGroups() {
  var h='<div class="toolbar">'+renderViewToggle('groups')+'<div class="spacer"></div>'+
    '<button class="btn sm" onclick="W.toggleMulti()">多选</button>'+
    '<button class="btn sm" onclick="W.openAdd()">+ 任务</button>'+
    '<button class="btn sm" onclick="W.addGroup()">+ 分组</button>'+
    '<button class="btn sm" onclick="W.importPrompt()">数据</button></div>';
  h+=renderMultiBar()+renderStats()+renderSearchBar()+renderFilterBar();
  var list=tasks.filter(function(t){ return matchesSearch(t)&&filterMatch(t); });
  /* 还有未完成事项的分组排前面；空分组、全部已完成的分组沉到最底部，组内顺序不变 */
  var cards=groups.map(function(g){ return {g:g, isNone:false, items:list.filter(function(t){return t.groupId===g.id;})}; });
  var orphan=list.filter(function(t){ return !t.groupId||!groupById(t.groupId); });
  if(orphan.length||!groups.length) cards.push({g:{id:'__none',name:'未分类',pri:'none',note:'',collapsed:false}, isNone:true, items:orphan});
  var active=[], idle=[];
  cards.forEach(function(c){ var pend=0; c.items.forEach(function(t){ if(!t.completed)pend++; }); (pend>0?active:idle).push(c); });
  var ordered=active.concat(idle), body='';
  ordered.forEach(function(c){ body+=groupCard(c.g,c.items,c.isNone); });
  h+= list.length? body : '<div class="empty"><span class="icon">◫</span>没有符合条件的任务<br>换个筛选或用顶部搜索试试</div>';
  return h;
}

/* ---- 快速添加：# 触发分组模糊搜索，可直接选或新建 ---- */
function fuzzyHit(text,q){
  if(!q) return true;
  var t=String(text).toLowerCase(), s=String(q).toLowerCase();
  if(t.indexOf(s)>=0) return true;
  var i=0; for(var c=0;c<t.length&&i<s.length;c++){ if(t[c]===s[i]) i++; }
  return i>=s.length;
}

/* ========= 日报：按目标日汇总「挂着的未完成 + 当天已完成」========= */
/* 分组的日报归属：'auto' 自动（按任务类型） / 'life' 归入生活简报 / 'none' 不参与 */
function groupReportMode(g){
  if(!g) return 'auto';
  if(g.noReport) return 'none';
  if(g.asLife) return 'life';
  return 'auto';
}
function setGroupReportMode(g, mode){
  if(!g) return;
  delete g.noReport; delete g.asLife;
  if(mode==='none') g.noReport=true;
  else if(mode==='life') g.asLife=true;
}
function reportModeText(mode){ return mode==='none'?'不参与':(mode==='life'?'生活':'自动'); }
/* 归属判定：整组标记优先于任务类型 */
function isLifeTask(t){
  if(t.groupId){ var g=groupById(t.groupId); if(g&&g.asLife) return true; }
  return t.type==='个人';
}
function reportScope(day){
  return tasks.filter(function(t){
    if(t.groupId){ var g=groupById(t.groupId); if(g&&g.noReport) return false; }  /* 该分组已从日报中排除 */
    if(t.completed) return !!(t.completedAt&&dayValue(t.completedAt)===dayValue(day));
    return !!t.day&&dayValue(t.day)<=dayValue(day);
  });
}
function reportStatusText(t){
  if(t.completed) return '进度正常';
  if(t.blocking) return '进度受阻';
  if(isOverdue(t)) return '进度延迟';
  return '进度正常';
}
function pushReportGroup(out,b){
  out.push(b.name+'：');
  applySort(b.items).forEach(function(t,i){
    out.push((i+1)+'、'+t.title+'，完成'+progressOf(t)+'%，'+reportStatusText(t)+'；');
    var d=String(t.detail||'').replace(/\s*\n+\s*/g,'；').trim();
    if(d) out.push('　备注：'+d);
  });
}
function reportSectionBody(list){
  var out=[], buckets=[], idx={};
  groups.forEach(function(g){ idx[g.id]=buckets.length; buckets.push({name:g.name,items:[]}); });
  var none={name:'未分类',items:[]};
  list.forEach(function(t){ var i=(t.groupId&&idx[t.groupId]!==undefined)?idx[t.groupId]:-1; if(i<0) none.items.push(t); else buckets[i].items.push(t); });
  buckets.forEach(function(b){ if(b.items.length) pushReportGroup(out,b); });
  if(none.items.length) pushReportGroup(out,none);
  return out;
}
function buildDailyReport(day){
  day=day||todayStr();
  var p=day.split('/'), md=parseInt(p[0],10)+'月'+parseInt(p[1],10)+'日';
  var all=reportScope(day);
  var work=all.filter(function(t){ return !isLifeTask(t); });
  var life=all.filter(function(t){ return isLifeTask(t); });
  var out=[md+'工作简报：'].concat(reportSectionBody(work));
  if(!work.length) out.push('暂无');
  if(life.length){ out.push(''); out.push(md+'生活简报：'); out=out.concat(reportSectionBody(life)); }
  out.push('课题/协调事项：'+((dailyNotes[day]||'').trim()||'暂无'));
  return out.join('\n');
}
function syncTopicLine(text, topic){
  var line='课题/协调事项：'+((topic||'').trim()||'暂无');
  if(!String(text||'').trim()) return line;
  var lines=String(text||'').split('\n'), i=-1;
  for(var k=lines.length-1;k>=0;k--){ if(lines[k].indexOf('课题/协调事项：')===0){ i=k; break; } }
  if(i>=0) lines[i]=line; else lines.push(line);
  return lines.join('\n');
}
function reportHintText(day){ return '今日完成 + 进行中（'+reportScope(day).length+' 项）自动生成 · 可直接编辑'; }
function reportHintHtml(day){ return '<span class="rpt-hint" id="rpt_hint">'+reportHintText(day)+'</span>'; }
function groupChipsHtml(){
  if(!groups.length) return '';

/* ---- 分组视图交互：名称/备注就地编辑、优先级、折叠、删除 ---- */
APP.addEventListener('change', function(e){
  var el=e.target;
  if(!el.classList||!el.classList.contains('gcpri'))return;
  var card=el.closest('.gcard'); var g=card?groupById(card.dataset.g):null;
  if(g){ g.pri=el.value; saveGroups(); render(); }
});
APP.addEventListener('blur', function(e){
  var el=e.target;
  if(!el.classList)return;
  /* 任务卡就地编辑：落库但不重绘，避免打断输入 */
  if(el.classList.contains('ie')){
    var t=taskById(el.dataset.id); if(!t)return;
    var f=el.dataset.field;
    if(f==='title'){
      var v=el.innerText.replace(/\s+/g,' ').trim();
      if(!v){ el.innerText=t.title; return; }
      if(v!==t.title){ t.title=v; saveTasks(); }
    }else if(f==='detail'){
      var d=el.innerText.replace(/\s+$/,'');
      if((t.detail||'')!==d){ t.detail=d; saveTasks(); }
    }
    return;
  }
  var card=el.closest('.gcard'); if(!card)return;
  var g=groupById(card.dataset.g); if(!g)return;
  if(el.classList.contains('gcname')){ var v=el.innerText.trim(); g.name=v||g.name; saveGroups(); }
  else if(el.classList.contains('gcnote')){ g.note=el.innerText.replace(/\s+$/,''); saveGroups(); }
}, true);
APP.addEventListener('click', function(e){
  var src=e.target;
  if(src.isContentEditable||src.tagName==='BUTTON'||src.tagName==='SELECT'||src.tagName==='INPUT')return;
  if(src.closest('.gdrag'))return;
  if(src.closest('[data-act="g-del"]'))return;
  var head=src.closest('.gchead'); if(!head)return;
  window.W.toggleGroup(head.dataset.g);
});

/* ---- 分组拖动排序（HTML5 DnD，只有标题栏的 ⠿ 把手可拖） ---- */
APP.addEventListener('dragstart', function(e){
  var h=e.target&&e.target.closest?e.target.closest('.gdrag'):null; if(!h)return;
  dragGid=h.dataset.g;
  var card=h.closest('.gcard'); if(card) card.classList.add('dragging');
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(dragGid)); }catch(x){}
}, true);
APP.addEventListener('dragend', function(){ dragGid=null; clearDropMarks(); var d=document.querySelectorAll('.gcard.dragging'); for(var i=0;i<d.length;i++)d[i].classList.remove('dragging'); }, true);
APP.addEventListener('dragover', function(e){
  if(!dragGid)return;
  var card=e.target&&e.target.closest?e.target.closest('.gcard'):null;
  if(!card||!card.dataset.g||card.dataset.g===dragGid||card.dataset.g==='__none')return;
  if(groupBucketOf(card.dataset.g)!==groupBucketOf(dragGid))return;   /* 两个区间之间不允许互换 */
  e.preventDefault();
  try{ e.dataTransfer.dropEffect='move'; }catch(x){}
  var r=card.getBoundingClientRect(), before=(e.clientY-r.top)<r.height/2;
  clearDropMarks(); card.classList.add(before?'drop-before':'drop-after');
}, true);
APP.addEventListener('drop', function(e){
  if(!dragGid)return;
  var card=e.target&&e.target.closest?e.target.closest('.gcard'):null;
  if(!card||!card.dataset.g)return;
  var to=card.dataset.g;
  if(to===dragGid||to==='__none')return;
  if(groupBucketOf(to)!==groupBucketOf(dragGid))return;
  e.preventDefault();
  var r=card.getBoundingClientRect(), before=(e.clientY-r.top)<r.height/2;
  clearDropMarks();
  window.W.moveGroup(dragGid,to,before);
}, true);

  },
  toggleMulti:function(){ multiSelect=!multiSelect; tasks.forEach(function(t){t._selected=false;}); render(); },

  undo:function(){

    else if(a.type==='remove'){ tasks.push(a.taskCopy); tasks.sort(function(x,y){return x.id-y.id;}); }
    else if(a.type==='postpone'){ var pt=tasks.find(function(x){return x.id===a.id;}); if(pt){ var lg=(pt.postponeLog||[]).pop(); if(lg) pt.day=(lg.from&&lg.from!=='-')?lg.from:null; pt.postponedCount=Math.max(0,(pt.postponedCount||1)-1); if(!pt.postponedCount){ delete pt.postponedFrom; delete pt.postponeLog; } } }

  toggleGroupReport:function(gid){ W.cycleGroupReport(gid); },
  moveGroup:function(from,to,before){
    var order=[]; groups.forEach(function(g){ order.push(g.id); });
    var fi=order.indexOf(from); if(fi<0)return;
    order.splice(fi,1);
    var ti=order.indexOf(to); if(ti<0)return;
    order.splice(before?ti:ti+1,0,from);
    var byId={}; groups.forEach(function(g){ byId[g.id]=g; });
    groups=order.map(function(id){ return byId[id]; });
    saveGroups(); render();
  },
  cycleGroupReport:function(gid){

    var m=groupReportMode(g);
    setGroupReportMode(g, m==='auto'?'life':(m==='life'?'none':'auto'));   /* 自动 → 生活 → 不参与 → 自动 */

  openPostpone:function(id){ postponeTaskId=id; render(); },
  closePostpone:function(){ postponeTaskId=null; render(); },

  applyPostpone:function(id,nd){
    var t=tasks.find(function(x){return x.id===id;}); if(!t||t.completed||!nd)return;
    var old=t.day;
    if(!t.postponedFrom) t.postponedFrom=old||todayStr();
    t.postponedCount=(t.postponedCount||0)+1;
    (t.postponeLog=t.postponeLog||[]).push({from:old||'-',to:nd,at:todayStr()});
    t.day=nd;
    undoAction={type:'postpone',id:t.id}; clearTimeout(undoTimer);
    saveTasks(); render();
    undoTimer=setTimeout(function(){ undoAction=null; render(); },4000);
  },
  togglePostponeFilter:function(){ postponeFilter=!postponeFilter; filter='all'; render(); },
  toggleOverdueFilter:function(){ overdueFilter=!overdueFilter; filter='all'; render(); },
  delGroup:function(gid){
    var g=groupById(gid); if(!g)return;
    var n=tasks.filter(function(t){return t.groupId===gid;}).length;
    if(!confirm('删除分组「'+g.name+'」？\n组内 '+n+' 条任务将转为「未分类」。'))return;
    tasks.forEach(function(t){ if(t.groupId===gid) delete t.groupId; });
    groups=groups.filter(function(x){return x.id!==gid;});
    saveTasks(); saveGroups(); render();
  },
  toggle:function(id){
    var t=tasks.find(function(x){return x.id===id;}); if(!t)return;
    if(t.completed){ t.completed=false; t.completedAt=null; t.completedNote=null; t.progress=(typeof t.progressBefore==='number')?t.progressBefore:0; saveTasks(); render(); return; }
    if(completePopup){ completeTaskId=id; render(); }else{ W.quickComplete(id); }
  },
  quickComplete:function(id){
    var t=tasks.find(function(x){return x.id===id;}); if(!t)return;
    undoAction={type:'toggle',id:t.id,completedAt:t.completedAt}; clearTimeout(undoTimer);
    t.completed=true; t.completedAt=todayStr(); t.completedNote=null; t.progressBefore=progressOf({progress:t.progress}); t.progress=100; var doneId=t.id;
    saveTasks(); render();
    if(wishMode) setTimeout(function(){ var card=document.querySelector('.task[data-id="'+doneId+'"]'); if(card)sparkCelebration(card); },80);
    undoTimer=setTimeout(function(){ undoAction=null; render(); },4000);
  },
  cancelComplete:function(){ completeTaskId=null; render(); },
  doComplete:function(){
    var t=tasks.find(function(x){return x.id===completeTaskId;}); if(!t)return;
    undoAction={type:'toggle',id:t.id,completedAt:t.completedAt}; clearTimeout(undoTimer);
    t.completed=true;
    var sa=document.getElementById('co_startedAt'); if(sa&&sa.value)t.startedAt=inputToDay(sa.value);
    var ca=document.getElementById('co_completedAt'); t.completedAt=ca&&ca.value?inputToDay(ca.value):todayStr();
    var cn=document.getElementById('co_note'); t.completedNote=(cn&&cn.value||'').trim()||null;
    t.progressBefore=(typeof t.progressBefore==='number')?t.progressBefore:(typeof t.progress==='number'?t.progress:0); t.progress=100;
    completeTaskId=null; saveTasks(); var doneId=t.id; render();
    if(wishMode) setTimeout(function(){ var card=document.querySelector('.task[data-id="'+doneId+'"]'); if(card)sparkCelebration(card); },80);
    undoTimer=setTimeout(function(){ undoAction=null; render(); },4000);
  },
  startTask:function(id){ var t=tasks.find(function(x){return x.id===id;}); if(t&&!t.startedAt){ t.startedAt=t.day||todayStr(); saveTasks(); render(); } },
  openAdd:function(){ editingId=null; showAddModal=true; render(); },
  edit:function(id){ editingId=id; showAddModal=true; render(); },
  closeModal:function(e){ if(e&&e.target!==e.currentTarget)return; showAddModal=false; editingId=null; render(); },
  qaInput:function(v,ctx){
    qaCtx=ctx||'w';
    var m=String(v||'').match(/#([^#]*)$/);
    if(!m){ qaGroupOpen=false; qaGroupItems=[]; qaGroupIdx=0; qaMenuHTML(); return; }
    var q=m[1].trim();
    var hits=groups.filter(function(g){ return fuzzyHit(g.name,q); });
    qaGroupItems=hits.slice(0,20).map(function(g){ return {id:g.id,name:g.name}; });
    if(q) qaGroupItems.push({__new:q});
    if(!qaGroupItems.length){ qaGroupItems=[{__empty:true}]; qaGroupOpen=true; qaGroupIdx=0; qaMenuHTML(); return; }
    qaGroupOpen=true; qaGroupIdx=0; qaMenuHTML();
  },
  qaMove:function(d){ if(!qaGroupOpen||!qaGroupItems.length)return; qaGroupIdx=(qaGroupIdx+d+qaGroupItems.length)%qaGroupItems.length; qaMenuHTML(); },
  qaPick:function(i){
    if(!qaGroupOpen||!qaGroupItems.length)return false;
    var pick=qaGroupItems[i]; if(!pick||pick.__empty)return false;
    if(pick.__new){ var g={id:nextGroupId(),name:pick.__new,pri:'中',note:'',collapsed:false}; groups.push(g); saveGroups(); pick={id:g.id,name:g.name}; }
    qaGroupIdx=i; qaGroupPick[qaCtx]=pick;
    var inp=document.getElementById('qa_input_'+qaCtx); if(inp) inp.value=inp.value.replace(/#([^#]*)$/,'').trim();
    var chip=document.getElementById('qa_group_chip_'+qaCtx);
    if(chip){ chip.innerHTML=escapeHtml(pick.name)+' ✕'; chip.classList.remove('hide'); }
    qaGroupOpen=false; qaGroupItems=[]; qaMenuHTML();
    return true;
  },
  qaClearGroup:function(ctx){
    var k=ctx||qaCtx; qaGroupPick[k]=null;
    var chip=document.getElementById('qa_group_chip_'+k);
    if(chip){ chip.innerHTML=''; chip.classList.add('hide'); }
  },
  qaClose:function(){ qaGroupOpen=false; qaGroupItems=[]; qaGroupIdx=0; qaMenuHTML(); },
  qaKey:function(e,ctx){
    qaCtx=ctx||'w';
    if(e.key==='ArrowDown'){ e.preventDefault(); W.qaMove(1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); W.qaMove(-1); return; }
    if(e.key==='Escape'){ e.preventDefault(); W.qaClose(); return; }
    if(e.key==='Enter'){ W.qaPick(qaGroupIdx); W.quickAdd(qaCtx); }
  },
  quickAdd:function(ctx){
    var k=ctx||qaCtx; qaCtx=k;
    var inp=document.getElementById('qa_input_'+k); if(!inp)return;
    var title=(inp.value||'').trim().replace(/#([^#]*)$/,'').trim(); if(!title)return;
    var dayEl=document.getElementById('qa_day_'+k);
    var day=(dayEl&&inputToDay(dayEl.value))||todayStr();
    var prioEl=document.getElementById('qa_prio_'+k);
    var nt={id:nextId(),title:title,detail:'',day:day,endDay:null,priority:(prioEl&&prioEl.value)||'中',type:(k==='p'?'个人':'工作'),blocking:null,completed:false,completedAt:null,createdAt:todayStr(),startedAt:null,progress:0};
    var pick=qaGroupPick[k];
    if(pick&&pick.id) nt.groupId=pick.id;
    qaGroupOpen=false; qaGroupItems=[]; W.qaClearGroup(k);
    tasks.push(nt);
    saveTasks(); inp.value=''; justQuickAdded=true;
    if(wishMode) coinDrop(inp); render();
  },
  saveTask:function(){
    var title=(document.getElementById('f_title').value||'').trim(); if(!title)return;
    var detail=(document.getElementById('f_detail').value||'').trim();
    var day=inputToDay(document.getElementById('f_day').value);
    var endRaw=document.getElementById('f_endDay').value,endDay=inputToDay(endRaw)||null;
    var type=document.getElementById('f_type').value;
    var blocking=(document.getElementById('f_blocking').value||'').trim()||null;
    var prio=document.querySelector('input[name="prio"]:checked'),priority=prio?prio.value:'中';
    var gEl=document.getElementById('f_group'),groupId=(gEl&&gEl.value)||'';
    var pgEl=document.getElementById('f_progress'),progress=pgEl?parseInt(pgEl.value,10):0;
    if(isNaN(progress))progress=0; progress=Math.max(0,Math.min(100,progress));
    if(editingId!==null){ var t=tasks.find(function(x){return x.id===editingId;}); if(t){ t.title=title; t.detail=detail; t.day=day||null; t.endDay=endDay&&dayValue(endDay)>dayValue(day)?endDay:null; t.type=type; t.blocking=blocking; t.priority=priority; if(groupId)t.groupId=groupId; else delete t.groupId; if(t.completed) t.progress=100; else if(pgEl) t.progress=progress; if(t.completed){ var ce=document.getElementById('f_completedAt'); if(ce&&ce.value)t.completedAt=inputToDay(ce.value); var cn=document.getElementById('f_completedNote'); if(cn)t.completedNote=(cn.value||'').trim()||null; } } }
    else{ var nt={id:nextId(),title:title,detail:detail,day:day||null,endDay:endDay&&dayValue(endDay)>dayValue(day)?endDay:null,priority:priority,type:type,blocking:blocking,completed:false,completedAt:null,createdAt:todayStr(),startedAt:null,progress:progress}; if(groupId)nt.groupId=groupId; tasks.push(nt); }
    saveTasks(); showAddModal=false; editingId=null; render();
  },
  remove:function(id){
    if(!confirm('确定删除？'))return;
    var t=tasks.find(function(x){return x.id===id;});
    if(t){ undoAction={type:'remove',id:t.id,taskCopy:JSON.parse(JSON.stringify(t))}; clearTimeout(undoTimer); }
    tasks=tasks.filter(function(t){return t.id!==id;}); saveTasks(); render();
    undoTimer=setTimeout(function(){ undoAction=null; render(); },4000);
  },
  exportData:function(){ showImport=true; render(); },
  importPrompt:function(){ showImport=true; render(); },
  downloadBackup:function(){
    var blob=new Blob([JSON.stringify(container(),null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='待办_备份_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  },  copyExport:function(){ var el=document.getElementById('export_text'); if(!el)return; navigator.clipboard.writeText(el.value).then(function(){ alert('已复制！'); }).catch(function(){ el.select(); }); },
  doImport:function(){
    var el=document.getElementById('import_text'); if(!el)return; var json=(el.value||'').trim(); if(!json)return;
    try{ var parsed=JSON.parse(json); var u=unwrap(parsed); if(!u)throw new Error('格式错误：需要数组或 {tasks:[...]}'); var data=u.tasks; if(u.groups&&u.groups.length)groups=u.groups; if(u.notes&&typeof u.notes==='object')dailyNotes=u.notes; var existingIds={}; tasks.forEach(function(t){existingIds[t.id]=t;}); var added=0,updated=0; data.forEach(function(t){ if(existingIds[t.id]){ Object.assign(existingIds[t.id],t); updated++; }else{ tasks.push(t); added++; } }); reportText=''; saveTasks(); showImport=false; render(); alert('导入成功！新增 '+added+' 条，更新 '+updated+' 条，共 '+tasks.length+' 条'); }
    catch(e){ alert('导入失败：'+e.message); }
  }
};

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'||e.target.isContentEditable)return;
  if(e.key==='n'||e.key==='N'){ e.preventDefault(); window.W.openAdd(); }
  if(e.key==='1'){ window.W.setView('daily'); }
  if(e.key==='2'){ window.W.setView('calendar'); }
  if(e.key==='3'){ window.W.setView('master'); }
  if(e.key==='4'){ window.W.setView('groups'); }
  if(e.key==='5'){ window.W.setView('report'); }
  if(e.key==='Escape'){ if(pickerEl){ closePicker(); return; } if(postponeTaskId!==null){ postponeTaskId=null; render(); return; } if(completeTaskId!==null){ completeTaskId=null; render(); return; } if(showAddModal){ showAddModal=false; editingId=null; render(); } if(showImport){ W.closeImport(); } }
});

loadPrefs(); loadTasks(function(){ applyTheme(); migrateGroups(); render(); loadTasksSync(); });
try{ render(); }catch(err){ APP.innerHTML='<div style="padding:20px;color:#c00;font-family:monospace;white-space:pre-wrap;">Render error:\n'+(err.stack||err.message)+'</div>'; console.error(err); }
})();
</script>
